[package]
name = "repo-uploader-and-manager"
version = "1.0.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Desktop GitHub repository manager"
authors = ["Repo Uploader and Manager"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
notify = "8"
regex = "1"
semver = "1"
sha2 = "0.11"
ureq = { version = "3.4", features = ["json"] }
rfd = "0.17"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
debug = 0
incremental = false

[profile.dev]
debug = 0

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
